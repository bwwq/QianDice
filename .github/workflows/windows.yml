name: Windows portable UI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    env:
      PYTHONUTF8: '1'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Rust MSVC
        run: rustup default 1.90.0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Stable core contracts
        run: cargo test --locked --all-targets
      - name: Build portable UI
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Portable lifecycle contracts
        run: python tests/portable_contract.py target/release/qianbian.exe
      - name: Self-extraction and desktop lifecycle
        run: python scripts/check-windows-ui.py dist/qianbian-windows-ui.exe
      - uses: actions/upload-artifact@v4
        with:
          name: qianbian-windows-ui
          path: |
            dist/qianbian-windows-ui.exe
            dist/windows-memory.json
            Cargo.lock
            ui/pubspec.lock
          if-no-files-found: error
