main:
  api_trigger_backup_prepare:
    - name: backup-prepare
      runner:
        tags: cnb:arch:amd64
        cpus: 8
      docker:
        build: scripts/cloud.Dockerfile
        volumes:
          - /root/.cargo/registry:copy-on-write
          - /root/.pub-cache:copy-on-write
      stages:
        - name: 检查备份依赖与接口
          script: |
            mkdir -p dist ui/assets/fonts
            rustup component add rustfmt
            curl -fL 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/OFL.txt' -o ui/assets/fonts/OFL.txt
            if (rustfmt --edition 2024 --config skip_children=true src/backup.rs src/store.rs src/server.rs src/portable.rs src/main.rs src/lib.rs && cargo check --all-targets && cd ui && flutter pub get --enforce-lockfile && dart format lib/backup_settings.dart lib/main.dart && flutter analyze --no-fatal-infos) > dist/backup-prepare.log 2>&1; then
              printf '0' > dist/backup-prepare-status.txt
            else
              printf '1' > dist/backup-prepare-status.txt
            fi
            cat dist/backup-prepare.log
            tar -czf dist/backup-source.tar.gz Cargo.lock src/backup.rs src/store.rs src/server.rs src/portable.rs src/main.rs src/lib.rs ui/lib/backup_settings.dart ui/lib/main.dart
        - name: 保存依赖与诊断
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - dist/backup-source.tar.gz
              - dist/backup-prepare.log
              - dist/backup-prepare-status.txt
        - name: 确认备份静态检查通过
          script: test "$(cat dist/backup-prepare-status.txt)" = 0
  push:
    - name: rust-verify
      runner:
        tags: cnb:arch:amd64
        cpus: 8
      docker:
        image: rust:1.90-bookworm
        volumes:
          - /usr/local/cargo/registry:copy-on-write
          - /usr/local/cargo/git:copy-on-write
      stages:
        - name: 云端能力
          script: |
            uname -a
            if test -c /dev/kvm; then echo 'KVM_DEVICE=present'; else echo 'KVM_DEVICE=absent'; fi
        - name: 稳定规则与协议验证
          script: cargo test --locked --all-targets
        - name: Rust构建
          script: cargo build --locked --release
        - name: 便携数据与插件契约
          script: |
            python3 tests/portable_contract.py target/release/qianbian
            python3 tests/backup_contract.py target/release/qianbian
        - name: 保存锁文件与后台
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - Cargo.lock
              - target/release/qianbian
  api_trigger_functional:
    - name: onebot-linux-functional
      runner:
        tags: cnb:arch:amd64
        cpus: 8
      docker:
        image: rust:1.90-bookworm
        volumes:
          - /usr/local/cargo/registry:copy-on-write
          - /usr/local/cargo/git:copy-on-write
      stages:
        - name: 准备发布程序与独立验收工具
          script: |
            cargo build --locked --release --bin qianbian
            mkdir -p dist
            cp target/release/qianbian dist/qianbian-linux-x86_64
            python3 scripts/build-protocol-check.py
        - name: 直接验收已有Linux发布程序
          script: |
            python3 scripts/verify-linux-functions.py || true
            if python3 -c "import json; assert json.load(open('dist/functional-report/summary.json'))['status']=='passed'"; then
              cargo build --locked --release --example rust_plugin
              QIANBIAN_TEST_REPORT_DIR=dist/functional-report python3 tests/sdk_contract.py target/release/examples/rust_plugin
              python3 tests/portable_contract.py target/release/qianbian
              python3 -c "import json; p='dist/functional-report/summary.json'; r=json.load(open(p)); r['cases'].append(json.load(open('dist/functional-report/rust_sdk.json'))); r['cases'].append({'id':'portable','status':'passed','features':['authentication','single instance','simulation isolation','Python SDK storage/timers','disable persistence','backup integrity/restore','SSE shutdown']}); open(p,'w').write(json.dumps(r,ensure_ascii=False,indent=2))"
            else
              printf '{"status":"skipped","id":"rust_sdk"}' > dist/functional-report/rust_sdk.json
            fi
            tar -C dist/functional-report -czf dist/functional-transcripts.tar.gz .
        - name: 保存功能结果与收发记录
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - dist/functional-report/summary.json
              - dist/functional-report/onebot-tests.log
              - dist/functional-report/rust_sdk.json
              - dist/functional-transcripts.tar.gz
              - dist/qianbian-linux-x86_64
              - dist/qianbian-protocol-check
        - name: 确认所有功能验收通过
          script: python3 -c "import json; assert json.load(open('dist/functional-report/summary.json'))['status']=='passed'; assert json.load(open('dist/functional-report/rust_sdk.json'))['status']=='passed'"
  api_trigger_release:
    - name: portable-release
      runner:
        tags: cnb:arch:amd64
        cpus: 8
      docker:
        build: scripts/cloud.Dockerfile
        volumes:
          - /root/.cargo/registry:copy-on-write
          - /root/.pub-cache:copy-on-write
      stages:
        - name: 构建便携发布包
          script: bash scripts/build-cloud.sh
        - name: 保存便携发布包
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - Cargo.lock
              - ui/pubspec.lock
              - web/package-lock.json
              - dist/qianbian-linux-x86_64
              - dist/qianbian-linux-ui-x86_64.tar.gz
              - dist/qianbian-windows-web.exe
              - dist/SHA256SUMS
              - dist/ui-desktop.png
              - dist/ui-compact.png
              - dist/ui-mobile.png
              - dist/ui-dark.png
              - dist/ui-login.png
              - dist/ui-runtime-errors.json
              - dist/ui-dom.html
              - dist/linux-memory.json
        - name: 确认界面运行结果
          script: python3 -c "import json; r=json.load(open('dist/ui-runtime-errors.json')); print(r); assert r['verified'], '界面运行检查失败，请查看已上传的截图与诊断'"
  api_trigger_web:
    - name: react-web
      runner:
        tags: cnb:arch:amd64
        cpus: 8
      docker:
        build: scripts/cloud.Dockerfile
        volumes:
          - /root/.cargo/registry:copy-on-write
          - /root/.npm:copy-on-write
      stages:
        - name: 构建React网页与后台
          script: |
            bash scripts/build-web.sh
            cargo test --locked --all-targets
            cargo build --locked --release --bin qianbian
            python3 tests/portable_contract.py target/release/qianbian
            node scripts/capture-ui.mjs
            cp target/release/qianbian dist/qianbian-linux-x86_64
        - name: 保存网页与运行诊断
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - web/package-lock.json
              - dist/qianbian-linux-x86_64
              - dist/ui-desktop.png
              - dist/ui-compact.png
              - dist/ui-mobile.png
              - dist/ui-dark.png
              - dist/ui-login.png
              - dist/ui-runtime-errors.json
              - dist/ui-dom.html
              - dist/linux-memory.json
        - name: 确认网页可用
          script: python3 -c "import json; r=json.load(open('dist/ui-runtime-errors.json')); print(r); assert r['verified']"
  api_trigger_fluent_prepare:
    - name: fluent-dependencies
      runner:
        tags: cnb:arch:amd64
        cpus: 8
      docker:
        build: scripts/cloud.Dockerfile
        volumes:
          - /root/.pub-cache:copy-on-write
      stages:
        - name: 解析Fluent依赖与静态检查
          script: |
            mkdir -p dist
            mkdir -p ui/assets/fonts
            curl -fL 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/OFL.txt' -o ui/assets/fonts/OFL.txt
            if (cd ui && flutter pub get --enforce-lockfile && dart format lib integration_test && flutter analyze --no-fatal-infos) > dist/fluent-analysis.txt 2>&1; then
              fluent_status=0
            else
              fluent_status=$?
            fi
            printf '%s' "$fluent_status" > dist/fluent-analysis-status.txt
            cat dist/fluent-analysis.txt
            cp ui/lib/main.dart dist/fluent-main.dart
            cp ui/lib/appearance.dart dist/fluent-appearance.dart
            cp ui/integration_test/desktop_contract.dart dist/fluent-contract.dart
        - name: 保存依赖与诊断
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - ui/pubspec.lock
              - ui/lib/main.dart
              - ui/lib/appearance.dart
              - ui/integration_test/desktop_contract.dart
              - dist/fluent-main.dart
              - dist/fluent-appearance.dart
              - dist/fluent-contract.dart
              - dist/fluent-analysis.txt
              - dist/fluent-analysis-status.txt
        - name: 确认静态检查通过
          script: test "$(cat dist/fluent-analysis-status.txt)" = 0
  api_trigger_linux_ui:
    - name: linux-desktop-acceptance
      runner:
        tags: cnb:arch:amd64
        cpus: 8
      docker:
        build: scripts/cloud.Dockerfile
        volumes:
          - /root/.cargo/registry:copy-on-write
          - /root/.pub-cache:copy-on-write
          - /root/.npm:copy-on-write
      stages:
        - name: 构建并验收Linux桌面
          script: |
            apt-get update -qq
            apt-get install -y --no-install-recommends xvfb xauth scrot
            QIANBIAN_LINUX_ONLY=1 bash scripts/build-cloud.sh
            xvfb-run -a -s '-screen 0 1366x900x24' python3 scripts/check-linux-ui.py dist/linux-ui
            QIANBIAN_TEST_BINARY="$(pwd)/target/release/qianbian" QIANBIAN_UI_REPORT_DIR="$(pwd)/dist" xvfb-run -a -s '-screen 0 1366x900x24' bash -c 'cd ui && flutter test integration_test/desktop_contract.dart -d linux'
        - name: 保存Linux桌面与内存记录
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - dist/qianbian-linux-x86_64
              - dist/qianbian-linux-ui-x86_64.tar.gz
              - dist/linux-desktop-memory.json
              - dist/fluent-linux-desktop.png
              - dist/fluent-overview.png
              - dist/fluent-dark-chat.png
              - dist/fluent-light-chat.png
              - dist/fluent-dark-overview.png
              - dist/fluent-settings.png
              - dist/fluent-compact.png
              - dist/ui-desktop.png
              - dist/ui-mobile.png
              - dist/ui-dark.png
              - dist/ui-login.png
  api_trigger_windows:
    - name: windows-desktop
      runner:
        namespace: group
        tags: [windows]
      stages:
        - name: Windows UI便携包
          script: powershell -NoProfile -File scripts/build-windows.ps1
