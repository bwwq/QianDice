main:
  push:
    - name: rust-verify
      runner:
        tags: cnb:arch:amd64
        cpus: 8
      docker:
        image: rust:1.90-bookworm
        volumes:
          - /usr/local/cargo/registry:copy-on-write
          - /usr/local/cargo/git:copy-on-write
      stages:
        - name: 云端能力
          script: |
            uname -a
            if test -c /dev/kvm; then echo 'KVM_DEVICE=present'; else echo 'KVM_DEVICE=absent'; fi
        - name: 稳定规则与协议验证
          script: cargo test --locked --all-targets
        - name: Rust构建
          script: cargo build --locked --release
        - name: 便携数据与插件契约
          script: python3 tests/portable_contract.py target/release/qianbian
        - name: 保存锁文件与后台
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - Cargo.lock
              - target/release/qianbian
  api_trigger_functional:
    - name: onebot-linux-functional
      runner:
        tags: cnb:arch:amd64
        cpus: 8
      docker:
        image: rust:1.90-bookworm
        volumes:
          - /usr/local/cargo/registry:copy-on-write
          - /usr/local/cargo/git:copy-on-write
      stages:
        - name: 准备发布程序与独立验收工具
          script: |
            cargo build --locked --release --bin qianbian
            mkdir -p dist
            cp target/release/qianbian dist/qianbian-linux-x86_64
            python3 scripts/build-protocol-check.py
        - name: 直接验收已有Linux发布程序
          script: |
            python3 scripts/verify-linux-functions.py || true
            if python3 -c "import json; assert json.load(open('dist/functional-report/summary.json'))['status']=='passed'"; then
              cargo build --locked --release --example rust_plugin
              QIANBIAN_TEST_REPORT_DIR=dist/functional-report python3 tests/sdk_contract.py target/release/examples/rust_plugin
              python3 tests/portable_contract.py target/release/qianbian
              python3 -c "import json; p='dist/functional-report/summary.json'; r=json.load(open(p)); r['cases'].append(json.load(open('dist/functional-report/rust_sdk.json'))); r['cases'].append({'id':'portable','status':'passed','features':['authentication','single instance','simulation isolation','Python SDK storage/timers','disable persistence','backup integrity/restore','SSE shutdown']}); open(p,'w').write(json.dumps(r,ensure_ascii=False,indent=2))"
            else
              printf '{"status":"skipped","id":"rust_sdk"}' > dist/functional-report/rust_sdk.json
            fi
            tar -C dist/functional-report -czf dist/functional-transcripts.tar.gz .
        - name: 保存功能结果与收发记录
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - dist/functional-report/summary.json
              - dist/functional-report/onebot-tests.log
              - dist/functional-report/rust_sdk.json
              - dist/functional-transcripts.tar.gz
              - dist/qianbian-linux-x86_64
              - dist/qianbian-protocol-check
        - name: 确认所有功能验收通过
          script: python3 -c "import json; assert json.load(open('dist/functional-report/summary.json'))['status']=='passed'; assert json.load(open('dist/functional-report/rust_sdk.json'))['status']=='passed'"
  api_trigger_release:
    - name: portable-release
      runner:
        tags: cnb:arch:amd64
        cpus: 8
      docker:
        build: scripts/cloud.Dockerfile
        volumes:
          - /root/.cargo/registry:copy-on-write
          - /root/.pub-cache:copy-on-write
      stages:
        - name: 构建便携发布包
          script: bash scripts/build-cloud.sh
        - name: 保存便携发布包
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - Cargo.lock
              - ui/pubspec.lock
              - web/package-lock.json
              - dist/qianbian-linux-x86_64
              - dist/qianbian-linux-ui-x86_64.tar.gz
              - dist/qianbian-windows-web.exe
              - dist/SHA256SUMS
              - dist/ui-desktop.png
              - dist/ui-compact.png
              - dist/ui-runtime-errors.json
              - dist/ui-dom.html
              - dist/linux-memory.json
        - name: 确认界面运行结果
          script: python3 -c "import json; r=json.load(open('dist/ui-runtime-errors.json')); print(r); assert r['verified'], '界面运行检查失败，请查看已上传的截图与诊断'"
  api_trigger_web:
    - name: react-web
      runner:
        tags: cnb:arch:amd64
        cpus: 8
      docker:
        build: scripts/cloud.Dockerfile
        volumes:
          - /root/.cargo/registry:copy-on-write
          - /root/.npm:copy-on-write
      stages:
        - name: 构建React网页与后台
          script: |
            bash scripts/build-web.sh
            cargo test --locked --all-targets
            cargo build --locked --release --bin qianbian
            python3 tests/portable_contract.py target/release/qianbian
            node scripts/capture-ui.mjs
            cp target/release/qianbian dist/qianbian-linux-x86_64
        - name: 保存网页与运行诊断
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - web/package-lock.json
              - dist/qianbian-linux-x86_64
              - dist/ui-desktop.png
              - dist/ui-compact.png
              - dist/ui-runtime-errors.json
              - dist/ui-dom.html
              - dist/linux-memory.json
        - name: 确认网页可用
          script: python3 -c "import json; r=json.load(open('dist/ui-runtime-errors.json')); print(r); assert r['verified']"
  api_trigger_linux_ui:
    - name: linux-desktop-acceptance
      runner:
        tags: cnb:arch:amd64
        cpus: 8
      docker:
        build: scripts/cloud.Dockerfile
        volumes:
          - /root/.cargo/registry:copy-on-write
          - /root/.pub-cache:copy-on-write
          - /root/.npm:copy-on-write
      stages:
        - name: 构建并验收Linux桌面
          script: |
            apt-get update -qq
            apt-get install -y --no-install-recommends xvfb xauth
            QIANBIAN_LINUX_ONLY=1 bash scripts/build-cloud.sh
            xvfb-run -a python3 scripts/check-linux-ui.py dist/linux-ui
        - name: 保存Linux桌面与内存记录
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - dist/qianbian-linux-x86_64
              - dist/qianbian-linux-ui-x86_64.tar.gz
              - dist/linux-desktop-memory.json
  api_trigger_windows:
    - name: windows-desktop
      runner:
        namespace: group
        tags: [windows]
      stages:
        - name: Windows UI便携包
          script: powershell -NoProfile -File scripts/build-windows.ps1
